name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - name: Check tag matches extension version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node -e "if(process.env.TAG_NAME !== 'v' + require('./extension/manifest.json').version) process.exit(1)"
      - name: Publish unsigned Firefox packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.xpi dist/*.zip --clobber
          else
            gh release create "$TAG_NAME" dist/*.xpi dist/*.zip --title "$TAG_NAME" --notes-file RELEASE-NOTES.md
          fi
